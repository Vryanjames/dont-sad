<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #060a22; overflow: hidden; }

  #cv {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  #scene2 {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: rgba(4, 7, 28, .38);
    font-family: "Press Start 2P", "Courier New", monospace; font-weight: bold;
    transition: opacity .9s ease, visibility .9s;
  }
  #scene2.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #title {
    margin: 0; text-align: center; color: #bfe6ff; line-height: 1.4;
    font-size: clamp(22px, 5.4vw, 44px);
    text-shadow: 3px 3px 0 #0a1238, -3px 3px 0 #0a1238, 3px -3px 0 #0a1238, -3px -3px 0 #0a1238, 0 0 18px rgba(150,210,255,.6);
  }
  #gif {
    max-width: min(78vw, 340px); max-height: 42vh; background: #fff;
    border: 4px solid #cfe3ff; box-shadow: 6px 6px 0 rgba(0,0,0,.45);
  }
  #picker {
    display: none; background: #fff; color: #1b1f4d; padding: 12px 16px; font-size: 10px; line-height: 1.6;
    border: 4px solid #cfe3ff; cursor: pointer; text-align: center; max-width: 80vw;
  }
  #picker input { display: none; }
  #replay {
    font-family: inherit; font-weight: bold; font-size: 14px; padding: 16px 22px; color: #1b1f4d;
    background: #ffd6e8; border: 4px solid #1b1f4d; cursor: pointer; box-shadow: 0 6px 0 #8c5a78;
  }
  #replay:hover { background: #ffe6f1; }
  #replay:active { transform: translateY(5px); box-shadow: 0 1px 0 #8c5a78; }

  .heart { position: absolute; bottom: 10vh; pointer-events: none; animation: rise 2.7s ease-out forwards; }
  .heart svg { display: block; shape-rendering: crispEdges; }
  @keyframes rise {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-60vh); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="scene2" class="hide">
  <h1 id="title">I Love You</h1>
  <img id="gif" src="happy.gif" alt="">
  <label id="picker">Can't find happy.gif.<br>Tap here and pick it<input type="file" accept="image/*" id="file"></label>
  <button id="replay">Play Again</button>
</div>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = v => { v = clamp(v); return v * v * (3 - 2 * v); };
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerpColor = (a, b, t) =>
  `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;

/* ================= pixel scene geometry ================= */
const SW = 320, SH = 147;          // the "designed" scene size, in game pixels
const GL = 113;                    // ground line (game pixels, scene coords)
const U = 3;                       // 1 game pixel = 3 drawing units for the cat/text layers
const GROUND = GL * U;             // ground in drawing units (339)

const cv = $("#cv"), ctx = cv.getContext("2d");
let PS = 3, LW = SW, LH = SH, ox = 0, oy = 0;

/* off-screen layers (cat + text are drawn smooth, then snapped to hard pixels) */
const LAYW = 520, LAYH = 260;
function makeLayer() {
  const c = document.createElement("canvas"); c.width = LAYW; c.height = LAYH;
  return { c, x: c.getContext("2d", { willReadFrequently: true }) };
}
const catL = makeLayer(), textL = makeLayer();
const bgC = document.createElement("canvas"), bg = bgC.getContext("2d");

/* ================= text metrics / timeline ================= */
const FONT = "bold 54px 'Comic Sans MS','Comic Neue','Chalkboard SE',cursive";
const TEXT = "I Love You";
textL.x.font = FONT;
const TW = textL.x.measureText(TEXT).width;

const START_X = 200, END_X = 470;
const TEXT_END_LEFT = END_X + 160;
const LEDGE = Math.round((TEXT_END_LEFT + TW * 0.55) / U) * U;
const LEDGE_L = LEDGE / U;
const T = { walk: 5200, fall: 6900, look: 7800, crouch: 8300, jump: 9500 };

/* ================= background (static part) ================= */
const TOP = [6, 10, 34], HOR = [58, 77, 153];
const MOON = { x: 62, y: 38, r: 19 };
let stars = [], clouds = [];

function pine(c, x, base, h) {
  const tH = Math.ceil(h / 3);
  for (let i = 0; i < h - 3; i++) {
    const tier = Math.floor(i / tH), k = i % tH;
    const hw = 1 + Math.round(k * (2.2 + tier * 1.2) / tH * 2) + tier * 2;
    c.fillRect(x - hw, base - h + i, hw * 2 + 1, 1);
  }
  c.fillRect(x - 1, base - 3, 3, 3);
}

function buildBg() {
  const c = bg, rng = mulberry32(11);
  c.clearRect(0, 0, LW, LH);
  const horizon = oy + GL;

  // sky in stepped bands
  const bands = 16;
  for (let b = 0; b < bands; b++) {
    const y0 = Math.floor(b * horizon / bands), y1 = Math.floor((b + 1) * horizon / bands);
    c.fillStyle = lerpColor(TOP, HOR, b / (bands - 1));
    c.fillRect(0, y0, LW, y1 - y0);
  }
  c.fillStyle = lerpColor(TOP, HOR, 1);
  c.fillRect(0, horizon, LW, LH - horizon);

  // moon + glow
  const mx = ox + MOON.x, my = oy + MOON.y, R = MOON.r;
  const craters = [[-6, -5, 4], [5, 3, 3], [-3, 8, 2], [7, -8, 2], [-9, 4, 2]];
  for (let y = -R - 14; y <= R + 14; y++) {
    for (let x = -R - 14; x <= R + 14; x++) {
      const d = Math.hypot(x, y);
      if (d > R + 12) continue;
      let col = null;
      if (d <= R) {
        col = (x * 0.6 + y * 0.8 > R * 0.55) ? "#dcdff5" : "#f4f4ff";
        for (const [cx, cy, cr] of craters) if (Math.hypot(x - cx, y - cy) <= cr) col = "#c5cae8";
      } else if (d <= R + 4) col = "rgba(130,160,255,.30)";
      else if (d <= R + 8) col = "rgba(130,160,255,.15)";
      else col = "rgba(130,160,255,.07)";
      c.fillStyle = col; c.fillRect(mx + x, my + y, 1, 1);
    }
  }

  // distant hills (also what the text falls toward)
  for (let x = 0; x < LW; x++) {
    const h = Math.round(7 + Math.sin(x * 0.045) * 4 + Math.sin(x * 0.11 + 1) * 2);
    c.fillStyle = "#1a2768"; c.fillRect(x, horizon - h, 1, LH - (horizon - h));
  }
  for (let x = 0; x < LW; x++) {
    const top = horizon + 16 + Math.round(Math.sin(x * 0.06 + 2) * 3 + Math.sin(x * 0.17) * 2);
    c.fillStyle = "#0e1644"; c.fillRect(x, top, 1, LH - top);
  }

  // pine trees behind the ground edge
  c.fillStyle = "#0a1238";
  for (let x = ox + 8, i = 0; x > -10; x -= 14 + Math.floor(rng() * 10), i++) {
    pine(c, x, horizon + 1, 28 + Math.floor(rng() * 22));
  }

  // ground ledge
  const gw = ox + LEDGE_L;
  c.fillStyle = "#2c3776"; c.fillRect(0, horizon, gw, LH - horizon);
  c.fillStyle = "#5766bd"; c.fillRect(0, horizon, gw, 1);
  c.fillStyle = "#3f4c97"; c.fillRect(0, horizon + 1, gw, 2);
  c.fillStyle = "#1f2859"; c.fillRect(gw - 2, horizon, 2, LH - horizon);
  c.fillStyle = "#232c66";
  for (let i = 0; i < gw * 0.4; i++) c.fillRect(Math.floor(rng() * gw), horizon + 4 + Math.floor(rng() * (LH - horizon - 4)), 1 + Math.floor(rng() * 2), 1);
  c.fillStyle = "#5766bd";
  for (let x = 0; x < gw - 2; x++) if (rng() > 0.72) c.fillRect(x, horizon - 1 - (rng() > 0.6 ? 1 : 0), 1, rng() > 0.6 ? 2 : 1);

  // stars
  const r2 = mulberry32(5);
  stars = [];
  const n = Math.floor(LW * LH / 150);
  for (let i = 0; i < n; i++) {
    const x = Math.floor(r2() * LW), y = Math.floor(r2() * (horizon - 14));
    if (Math.hypot(x - mx, y - my) < R + 15) continue;
    stars.push({ x, y, p: r2() * TAU, big: r2() > 0.86 });
  }

  // clouds
  const r3 = mulberry32(9);
  const defs = [
    { s: 0, y: 24 }, { s: 1, y: 44 }, { s: 0, y: 8 }, { s: 1, y: 66 }, { s: 0, y: 52 }
  ];
  clouds = defs.map((d, i) => ({
    s: d.s, y: oy + d.y, x: r3() * LW, v: 2.5 + r3() * 3.5
  }));
}

const CLOUD_SHAPES = [
  [
    "      ########      ",
    "    ############    ",
    "  ################  ",
    " ################## ",
    "####################",
    " ################## "
  ],
  [
    "     #####      ",
    "   ##########   ",
    " ############## ",
    "################",
    " ############## "
  ]
];

function drawClouds(dt) {
  for (const cl of clouds) {
    cl.x += cl.v * dt / 1000;
    const sh = CLOUD_SHAPES[cl.s], w = sh[0].length;
    if (cl.x > LW + 2) cl.x = -w - 2;
    const x0 = Math.floor(cl.x), y0 = cl.y;
    for (let r = 0; r < sh.length; r++) {
      ctx.fillStyle = r < 2 ? "#6f80c2" : (r === sh.length - 1 ? "#34428a" : "#4a5ba0");
      for (let k = 0; k < w; k++) if (sh[r][k] === "#") ctx.fillRect(x0 + k, y0 + r, 1, 1);
    }
  }
}

function drawStars(clock) {
  for (const s of stars) {
    const tw = Math.sin(clock / 650 + s.p);
    ctx.fillStyle = tw > 0.5 ? "#ffffff" : tw > -0.3 ? "#a7b6f0" : "#5f6faf";
    ctx.fillRect(s.x, s.y, 1, 1);
    if (s.big && tw > 0.2) {
      ctx.fillRect(s.x - 1, s.y, 3, 1);
      ctx.fillRect(s.x, s.y - 1, 1, 3);
    }
  }
}

/* ================= cat ================= */
function drawCat(c, s) {
  c.save();
  c.translate(s.cx + s.jx, GROUND + s.jy);
  c.rotate(s.rot);
  c.scale(1, s.squash);
  c.fillStyle = "#000"; c.strokeStyle = "#000";
  c.lineCap = "round"; c.lineJoin = "round";

  const bob = -Math.abs(Math.sin(s.phase)) * 5 * s.amp;
  const by = -80 + bob;

  // tail
  const sway = Math.sin(s.tailT) * s.tailAmp;
  c.lineWidth = 14;
  c.beginPath();
  c.moveTo(-82, by + 8);
  c.bezierCurveTo(-125, by + 18, -150, by - 5 + sway * 0.5, -148, by - 48 + sway);
  c.stroke();

  // legs
  const legs = [[-64, 0], [-42, Math.PI], [46, Math.PI], [68, 0]];
  c.lineWidth = 20;
  for (const [hx, o] of legs) {
    const swing = Math.sin(s.phase + o) * s.amp;
    const lift = Math.max(0, Math.cos(s.phase + o)) * s.amp;
    const dir = hx > 0 ? 1 : -1;
    const fx = hx + swing * 26 * (1 - s.air) + dir * 48 * s.air;
    const fy = -10 - lift * 16 * (1 - s.air) - 24 * s.air;
    c.beginPath(); c.moveTo(hx, by + 34); c.lineTo(fx, fy); c.stroke();
  }

  // body
  c.beginPath(); c.ellipse(0, by, 98, 52, 0, 0, TAU); c.fill();

  // head
  c.save();
  c.translate(78, by - 8);
  c.rotate(s.tilt);
  c.beginPath(); c.arc(40, -6, 40, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(12, -30); c.lineTo(22, -70); c.lineTo(48, -40); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(36, -42); c.lineTo(64, -68); c.lineTo(72, -26); c.closePath(); c.fill();
  c.fillStyle = "#fff"; c.strokeStyle = "#fff";
  const ry = 9 * (1 - s.eyes);
  if (s.eyes > 0.85) {
    c.lineWidth = 5;
    for (const ex of [46, 68]) { c.beginPath(); c.moveTo(ex - 7, -6); c.lineTo(ex + 7, -6); c.stroke(); }
  } else {
    for (const ex of [46, 68]) { c.beginPath(); c.ellipse(ex, -6, 7.5, Math.max(2, ry), 0, 0, TAU); c.fill(); }
  }
  c.restore();
  c.restore();
}

/* snap a smooth layer to hard pixels (the pixel-art look) */
function binarize(layer, isCat) {
  const c = layer.x;
  const img = c.getImageData(0, 0, LAYW, LAYH), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 128) { d[i + 3] = 0; continue; }
    d[i + 3] = 255;
    if (isCat) {
      if ((d[i] + d[i + 1] + d[i + 2]) / 3 > 120) { d[i] = 255; d[i + 1] = 248; d[i + 2] = 205; }
      else { d[i] = 4; d[i + 1] = 4; d[i + 2] = 10; }
    }
  }
  c.putImageData(img, 0, 0);
}

function beginLayer(layer) {
  layer.x.setTransform(1, 0, 0, 1, 0, 0);
  layer.x.clearRect(0, 0, LAYW, LAYH);
  layer.x.setTransform(1 / U, 0, 0, 1 / U, 0, 0);
}

/* ================= animation ================= */
let simT = 0, phase = 0, lastNow = 0, clock = 0, state = "play", endShown = false;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - lastNow, 50);
  lastNow = now;
  clock += dt;

  ctx.drawImage(bgC, 0, 0);
  drawStars(clock);
  drawClouds(dt);

  if (state !== "play") return;
  simT += dt;
  const t = simT;

  const s = {
    cx: END_X, jx: 0, jy: 0, rot: 0, squash: 1, alpha: 1, phase,
    amp: 0, air: 0, tilt: 0, eyes: 0, tailT: clock / 260, tailAmp: 14
  };
  let txt = null; // {x,y,rot,left,alpha}

  if (t < T.walk) {
    const u = Math.max(0, t) / T.walk;
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    s.cx = START_X + (END_X - START_X) * e;
    s.amp = clamp(Math.min(t / 500, (T.walk - t) / 600));
    phase += dt * 0.0075 * s.amp;
    s.phase = phase;
    s.tilt = Math.sin(phase * 2) * 0.03 * s.amp;
    txt = { x: s.cx + 160 + Math.sin(phase * 2) * 3 * s.amp, y: GROUND - 6, rot: 0, left: 0, alpha: 1 };
  } else if (t < T.fall) {
    const u = (t - T.walk) / (T.fall - T.walk);
    const v = clamp((u - 0.15) / 0.85);
    s.tilt = 0.5 * smooth(u * 2);
    s.tailAmp = 28;
    txt = {
      x: LEDGE + v * v * 50, y: GROUND - 6 + v * v * v * 430, rot: v * v * 1.5,
      left: TEXT_END_LEFT - LEDGE, alpha: 1 - clamp((v - 0.7) / 0.3)
    };
  } else if (t < T.look) {
    const u = (t - T.fall) / (T.look - T.fall);
    s.tilt = 0.5 * (1 - smooth(u * 1.6));
    s.eyes = smooth((u - 0.45) * 4);
    s.tailAmp = 20;
  } else if (t < T.crouch) {
    const u = (t - T.look) / (T.crouch - T.look);
    s.squash = 1 - 0.2 * smooth(u);
    s.eyes = 1;
    s.cx = END_X - 6 * smooth(u);
  } else if (t < T.jump) {
    const v = (t - T.crouch) / (T.jump - T.crouch);
    s.jx = 760 * v;
    s.jy = -170 * 4 * v * (1 - v);
    s.rot = -0.35 + v * 0.7;
    s.squash = v < 0.15 ? 0.8 + (0.3 * v / 0.15) : 1.1 - 0.1 * smooth((v - 0.15) * 3);
    s.air = smooth(v * 4);
    s.alpha = 1 - smooth((v - 0.65) / 0.35);
    s.tailAmp = 30;
  } else {
    if (!endShown) showEnd();
    return;
  }

  // text layer
  if (txt && txt.alpha > 0) {
    beginLayer(textL);
    const c = textL.x;
    c.save();
    c.font = FONT; c.fillStyle = "#a8dcff"; c.textBaseline = "alphabetic";
    c.translate(txt.x, txt.y); c.rotate(txt.rot);
    c.fillText(TEXT, txt.left, 0);
    c.restore();
    binarize(textL, false);
    ctx.globalAlpha = txt.alpha;
    ctx.drawImage(textL.c, ox, oy);
    ctx.globalAlpha = 1;
  }

  // cat layer
  beginLayer(catL);
  drawCat(catL.x, s);
  binarize(catL, true);
  ctx.globalAlpha = s.alpha;
  ctx.drawImage(catL.c, ox, oy);
  ctx.globalAlpha = 1;
}

/* ================= end screen ================= */
let heartTimer = null;
const HEART = ["0110110", "1111111", "1111111", "0111110", "0011100", "0001000"];
function heartSVG(px) {
  let r = "";
  HEART.forEach((row, y) => [...row].forEach((v, x) => { if (v === "1") r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }));
  return `<svg viewBox="0 0 7 6" width="${7 * px}" height="${6 * px}" fill="#ff5a8a">${r}</svg>`;
}

function showEnd() {
  endShown = true; state = "end";
  $("#scene2").classList.remove("hide");
  const g = $("#gif");
  if (g.style.display !== "none") { const src = g.getAttribute("src"); g.src = ""; g.src = src; }
  let n = 0;
  heartTimer = setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = heartSVG(3 + Math.floor(Math.random() * 3));
    h.style.left = (12 + Math.random() * 76) + "vw";
    $("#scene2").appendChild(h);
    setTimeout(() => h.remove(), 2800);
    if (++n > 10) { clearInterval(heartTimer); heartTimer = null; }
  }, 260);
}

function play() {
  clearInterval(heartTimer); heartTimer = null;
  document.querySelectorAll(".heart").forEach(h => h.remove());
  $("#scene2").classList.add("hide");
  simT = -600; phase = 0; endShown = false; state = "play";
}
$("#replay").addEventListener("click", play);

/* ================= the gif (with fallbacks) ================= */
const gifEl = $("#gif");
const names = ["happy.gif", "happy.GIF", "happy.gif.gif", "happy"];
let tryIdx = 0;
gifEl.addEventListener("error", () => {
  tryIdx++;
  if (tryIdx < names.length) { gifEl.src = names[tryIdx]; return; }
  let saved = null;
  try { saved = localStorage.getItem("happyGif"); } catch (e) {}
  if (saved && gifEl.getAttribute("src") !== saved) { gifEl.src = saved; return; }
  gifEl.style.display = "none";
  $("#picker").style.display = "block";
});
$("#file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    gifEl.style.display = "";
    gifEl.src = r.result;
    $("#picker").style.display = "none";
    try { localStorage.setItem("happyGif", r.result); } catch (err) {}
  };
  r.readAsDataURL(f);
});

/* ================= layout ================= */
function layout() {
  const raw = Math.min(innerWidth / SW, innerHeight / SH);
  PS = raw >= 2 ? Math.floor(raw) : raw;
  LW = Math.ceil(innerWidth / PS) + 1;
  LH = Math.ceil(innerHeight / PS) + 1;
  cv.width = LW; cv.height = LH;
  cv.style.width = (LW * PS) + "px"; cv.style.height = (LH * PS) + "px";
  ctx.imageSmoothingEnabled = false;
  bgC.width = LW; bgC.height = LH;
  ox = Math.floor((LW - SW) / 2); oy = Math.floor((LH - SH) / 2);
  buildBg();
}
window.addEventListener("resize", layout);

layout();
lastNow = performance.now();
requestAnimationFrame(frame);
play();
</script>
</body>
</html>
